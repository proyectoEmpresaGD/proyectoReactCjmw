name: CI Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release a documentar, por ejemplo v6.9.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build project
        run: npm run build

  release:
    name: Release
    needs: tests
    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.tests.result == 'success'
        ) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Release Please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Resolve release tag
        id: target
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.release.outputs.release_created == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          AUTOMATIC_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="$MANUAL_TAG"
          else
            RELEASE_TAG="$AUTOMATIC_TAG"
          fi

          if ! echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: invalid release tag: $RELEASE_TAG"
            echo "Expected format: v6.9.2"
            exit 1
          fi

          echo "Release tag selected: $RELEASE_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Refresh Git tags
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.release.outputs.release_created == 'true'
        run: |
          git fetch --force --tags origin

      - name: Verify release tag
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: |
          if ! git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            echo "Error: tag $RELEASE_TAG does not exist."
            exit 1
          fi

          echo "Tag $RELEASE_TAG exists."

      - name: Generate AI release notes
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.release.outputs.release_created == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Error: OPENAI_API_KEY is not configured."
            exit 1
          fi

          echo "========================================"
          echo "Current release: $RELEASE_TAG"
          echo "Detecting previous release..."
          echo "========================================"

          PREV_TAG=$(git tag \
            --merged "$RELEASE_TAG" \
            --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -Fxv "$RELEASE_TAG" \
            | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            echo "Error: no previous release was found."
            exit 1
          fi

          if [ "$PREV_TAG" = "$RELEASE_TAG" ]; then
            echo "Error: previous release matches current release."
            exit 1
          fi

          echo ""
          echo "Previous release: $PREV_TAG"
          echo "Current release:  $RELEASE_TAG"
          echo "Comparing:        $PREV_TAG -> $RELEASE_TAG"
          echo ""

          git log \
            "${PREV_TAG}..${RELEASE_TAG}" \
            --pretty=format:"- %s" \
            > release_commits.txt

          git diff \
            --name-status \
            "${PREV_TAG}..${RELEASE_TAG}" \
            > release_files.txt

          git diff \
            --unified=1 \
            "${PREV_TAG}..${RELEASE_TAG}" \
            -- \
            . \
            ':(exclude)package-lock.json' \
            ':(exclude)server/package-lock.json' \
            > release_diff_full.txt

          head -c 18000 release_diff_full.txt > release_diff.txt

          echo "Commits included:"
          cat release_commits.txt

          echo ""
          echo "Changed files:"
          cat release_files.txt

          COMMITS=$(cat release_commits.txt)
          CHANGED_FILES=$(cat release_files.txt)
          DIFF=$(cat release_diff.txt)

          cat > release_prompt.md <<EOF
          Actúa como un Release Engineer senior.

          Debes documentar EXCLUSIVAMENTE los cambios realizados entre:

          Versión anterior:
          $PREV_TAG

          Nueva versión:
          $RELEASE_TAG

          OBJETIVO

          Crear unas release notes claras y profesionales que expliquen
          qué ha cambiado realmente respecto a la versión inmediatamente
          anterior.

          No utilices información anterior a $PREV_TAG.

          No inventes cambios.

          Basa todo el contenido únicamente en:

          - Los commits proporcionados.
          - Los archivos modificados.
          - El diff proporcionado.

          CONTEXTO DEL PROYECTO

          - React
          - Vite
          - Node.js
          - Vercel
          - Aplicación en producción

          IDIOMA

          Español.

          FORMATO

          Markdown compatible con GitHub.

          Utiliza únicamente aquellas secciones para las que exista
          información real.

          ## Resumen

          Explica brevemente qué aporta $RELEASE_TAG respecto a $PREV_TAG.

          ## Cambios principales

          Describe los cambios funcionales importantes.

          ## Correcciones

          Describe errores, problemas o comportamientos corregidos.

          ## Seguridad

          Describe vulnerabilidades solucionadas, actualizaciones de
          seguridad o dependencias modificadas por motivos de seguridad.

          ## Mejoras técnicas

          Describe refactorizaciones, tests, dependencias, CI/CD,
          rendimiento, arquitectura o mantenimiento.

          ## Impacto

          Explica brevemente el impacto sobre el usuario final,
          estabilidad, seguridad o mantenibilidad.

          REGLAS

          - No copies literalmente los mensajes de commit.
          - No inventes funcionalidades.
          - No inventes correcciones.
          - No incluyas cambios anteriores a $PREV_TAG.
          - No describas algo que no pueda demostrarse con los datos.
          - Agrupa cambios relacionados.
          - Prioriza el propósito del cambio sobre el nombre del archivo.
          - No listes archivos salvo que ayude realmente a entender el cambio.
          - Omite cualquier sección que no tenga contenido real.
          - No incluyas introducciones genéricas.
          - No menciones que eres una IA.
          - No documentes package-lock.json.
          - No documentes server/package-lock.json.
          - No confundas cambios internos con funcionalidades visibles
            para el usuario.

          ==================================================
          COMMITS ENTRE $PREV_TAG Y $RELEASE_TAG
          ==================================================

          $COMMITS

          ==================================================
          ARCHIVOS MODIFICADOS
          ==================================================

          $CHANGED_FILES

          ==================================================
          DIFF ENTRE $PREV_TAG Y $RELEASE_TAG
          ==================================================

          $DIFF
          EOF

          jq -Rs \
            '{
              model: "gpt-4.1-mini",
              input: .,
              store: false,
              max_output_tokens: 1500
            }' \
            release_prompt.md \
            > request.json

          echo ""
          echo "Generating AI release notes..."

          MAX_ATTEMPTS=5
          ATTEMPT=1
          WAIT_SECONDS=5
          HTTP_STATUS=""

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo ""
            echo "OpenAI request attempt $ATTEMPT/$MAX_ATTEMPTS"

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --output response.json \
              --write-out "%{http_code}" \
              https://api.openai.com/v1/responses \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -d @request.json)

            echo "OpenAI HTTP status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ]; then
              break
            fi

            API_ERROR=$(jq -r '.error.message // empty' response.json)
            API_ERROR_TYPE=$(jq -r '.error.type // empty' response.json)
            API_ERROR_CODE=$(jq -r '.error.code // empty' response.json)

            echo "OpenAI API error:"
            echo "Type: $API_ERROR_TYPE"
            echo "Code: $API_ERROR_CODE"
            echo "Message: $API_ERROR"

            if [ "$HTTP_STATUS" != "429" ]; then
              echo "Non-retryable OpenAI API error."
              exit 1
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "OpenAI API still returned 429 after $MAX_ATTEMPTS attempts."
              exit 1
            fi

            echo "Waiting ${WAIT_SECONDS}s before retry..."

            sleep "$WAIT_SECONDS"

            ATTEMPT=$((ATTEMPT + 1))
            WAIT_SECONDS=$((WAIT_SECONDS * 2))
          done

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "OpenAI API request failed."
            cat response.json
            exit 1
          fi

          NOTES=$(jq -r '
            .output_text //
            (
              [
                .output[]?.content[]?
                | select(.type == "output_text")
                | .text
              ]
              | join("\n")
            ) //
            empty
          ' response.json)

          if [ -z "$NOTES" ] || [ "$NOTES" = "null" ]; then
            echo "Error: no release notes were generated."
            echo ""
            echo "Raw OpenAI response:"
            cat response.json
            exit 1
          fi

          printf "%s\n" "$NOTES" > release_notes.md

          echo ""
          echo "========================================"
          echo "Generated release notes"
          echo "========================================"
          cat release_notes.md
          echo ""
          echo "========================================"

      - name: Update GitHub Release body
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.release.outputs.release_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Error: GitHub Release $RELEASE_TAG does not exist."
            exit 1
          fi

          gh release edit "$RELEASE_TAG" \
            --notes-file release_notes.md

          echo "GitHub Release $RELEASE_TAG updated successfully."